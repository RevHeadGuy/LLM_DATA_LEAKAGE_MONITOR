name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only the dev tooling (ESLint) is needed for lint + unit tests.
      # The heavy inference deps (@xenova/transformers, onnxruntime-web) are
      # ignored here so CI stays fast; they are only used by test:dataset.
      - name: Install ESLint
        run: npm install --no-save eslint@^9.0.0

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test
